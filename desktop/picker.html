<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: -apple-system, Segoe UI, sans-serif; margin: 0; padding: 16px; background: #1e1e1e; color: #eee; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  ul { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow-y: auto; }
  li { padding: 8px 10px; border-radius: 4px; cursor: pointer; margin-bottom: 4px; border: 1px solid #444; }
  li:hover { background: #333; }
  .actions { margin-top: 14px; text-align: right; }
  button { background: #444; color: #eee; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; }
  button:hover { background: #555; }
</style>
</head>
<body>
  <h2 id="title">Select a device</h2>
  <ul id="list"></ul>
  <div class="actions"><button id="cancel">Cancel</button></div>
  <script>
    window.picker.onInit(({ title, items }) => {
      document.getElementById('title').textContent = title;
      const list = document.getElementById('list');
      items.forEach((item) => {
        const li = document.createElement('li');
        li.textContent = item.label;
        li.onclick = () => window.picker.select(item.id);
        list.appendChild(li);
      });
    });
    document.getElementById('cancel').onclick = () => window.picker.cancel();
  </script>
</body>
</html>
