<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: #1e1e1e;
    color: #eee;
    font-family: -apple-system, Segoe UI, sans-serif;
  }
  #heading {
    margin: 0 0 12px;
    font-size: 15px;
  }
  #entries {
    max-height: 220px;
    margin: 0;
    padding: 0;
    list-style: none;
    overflow-y: auto;
  }
  #entries .entry {
    margin-bottom: 4px;
    padding: 8px 10px;
    border: 1px solid #444;
    border-radius: 4px;
    cursor: pointer;
  }
  #entries .entry:hover {
    background: #333;
  }
  #footer {
    margin-top: 14px;
    text-align: right;
  }
  #dismiss-btn {
    padding: 6px 14px;
    border: none;
    border-radius: 4px;
    color: #eee;
    background: #444;
    cursor: pointer;
  }
  #dismiss-btn:hover {
    background: #555;
  }
</style>
</head>
<body>
  <h2 id="heading">Select a device</h2>
  <ul id="entries"></ul>
  <div id="footer"><button id="dismiss-btn">Cancel</button></div>
  <script>
    const headingEl = document.getElementById('heading');
    const entriesEl = document.getElementById('entries');

    function renderEntries(entries) {
      entriesEl.innerHTML = '';
      const fragment = document.createDocumentFragment();
      for (const entry of entries) {
        const row = document.createElement('li');
        row.className = 'entry';
        row.textContent = entry.label;
        row.addEventListener('click', () => window.devicePicker.choose(entry.id));
        fragment.appendChild(row);
      }
      entriesEl.appendChild(fragment);
    }

    window.devicePicker.onOpen((payload) => {
      headingEl.textContent = payload.title;
      renderEntries(payload.items);
    });

    document.getElementById('dismiss-btn')
      .addEventListener('click', () => window.devicePicker.dismiss());
  </script>
</body>
</html>
