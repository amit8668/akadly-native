<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akadly (native)</title>
  </head>
  <body>
    <header>
      <h1>
        <svg viewBox="0 0 52 52" fill="none" aria-hidden="true">
          <rect class="mark-outline" x="3" y="3" width="46" height="46" rx="12" fill="none" stroke-width="3.5"/>
          <rect class="mark-pin" x="21" y="0" width="10" height="7" rx="2"/>
          <path class="mark-signal" d="M14 26 L21 26 L24 19 L28 33 L31 26 L38 26" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Akadly <span class="badge">native</span>
      </h1>
      <div class="controls">
        <div class="theme-toggle" id="themeToggle" title="Theme">
          <button data-theme-mode="light" title="Light theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.4 4.4l1.7 1.7M17.9 17.9l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.4 19.6l1.7-1.7M17.9 6.1l1.7-1.7"/></svg>
          </button>
          <button data-theme-mode="dark" title="Dark theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z"/></svg>
          </button>
        </div>
        <select id="boardSelect"></select>
        <button id="connectBtn">Connect</button>
        <button id="runBtn" disabled>Run</button>
      </div>
    </header>
    <nav class="tabbar">
      <button class="tab active" data-tab="blocks">Blocks</button>
      <button class="tab" data-tab="device">Device</button>
      <button class="tab" data-tab="ota">OTA</button>
      <button class="tab" data-tab="terminal">Remote Access</button>
    </nav>
    <main>
      <section class="panel active" id="panel-blocks">
        <div id="workspace"></div>
        <aside>
          <h2>Generated Python</h2>
          <pre id="codePreview"></pre>
          <h2>Output</h2>
          <pre id="output"></pre>
        </aside>
      </section>
      <section class="panel" id="panel-device"></section>
      <section class="panel" id="panel-ota">
        <iframe src="/ota/index.html" title="OTA Deploy"></iframe>
      </section>
      <section class="panel" id="panel-terminal">
        <iframe src="/terminal/index.html" title="Remote Access"></iframe>
      </section>
    </main>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
